name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22.21
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Contraste de la paleta
        run: pnpm check:contrast

      - name: Build
        run: pnpm build
        env:
          NUXT_SESSION_PASSWORD: clave-solo-para-el-build-de-ci-32-caracteres
